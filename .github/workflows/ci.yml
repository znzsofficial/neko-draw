name: Tests and source package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
        sdk: ['==2.12.0', '>=2.12,<3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verified via official API
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; verified via official API
        with:
          python-version: ${{ matrix.python }}
      - name: Install real SDK and runtime/test dependencies
        run: python -m pip install "maibot-plugin-sdk${{ matrix.sdk }}" "aiohttp>=3.12" "httpx>=0.26" "Pillow>=10" tzdata
      - run: python scripts/check.py
      - name: Build allowlisted ZIP and import extracted plugin with real SDK
        run: python scripts/package.py
