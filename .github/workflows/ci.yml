name: Tests and source package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
        sdk: ['==2.12.0', '>=2.12,<3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; verified via official API
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5; verified via official API
        with:
          python-version: ${{ matrix.python }}
      - name: Install real SDK and runtime/test dependencies
        run: python -m pip install "maibot-plugin-sdk${{ matrix.sdk }}" "aiohttp>=3.12" "httpx>=0.26" "Pillow>=10" tzdata
      - run: python scripts/check.py
      - name: Build allowlisted ZIP and import extracted plugin with real SDK
        run: python scripts/package.py
